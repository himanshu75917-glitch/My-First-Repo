<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard with CSS Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Main Grid Layout */
        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr 50px;

            grid-template-areas:
                "head head"
                "side main"
                "foot foot";

            gap: 10px;
            padding: 10px;
            background-color: #f1f5f9;
        }

        /* Top Bar */
        .header {
            grid-area: head;
            background-color: #1e3a8a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* Side Menu */
        .sidebar {
            grid-area: side;
            background-color: #dbeafe;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar h3 {
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            padding: 12px;
            margin-bottom: 10px;
            background-color: white;
            border-radius: 5px;
        }

        /* Main Area */
        .main {
            grid-area: main;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .main h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3a8a;
        }

        /* Automatic Responsive Grid */
        .box-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        /* Dashboard Boxes using Flexbox */
        .box {
            background-color: #eff6ff;
            padding: 25px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 3px 8px #00000015;
        }

        .icon {
            font-size: 30px;
        }

        .box p {
            color: #1e3a8a;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            grid-area: foot;
            background-color: #1e3a8a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 70px auto 1fr 50px;

                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }
        }

    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Top Bar -->
        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <!-- Side Menu -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>🏠 Home</li>
                <li>👤 Profile</li>
                <li>📊 Reports</li>
                <li>⚙ Settings</li>
                <li>🚪 Logout</li>
            </ul>
        </aside>

        <!-- Main Area -->
        <main class="main">

            <h2>Dashboard Overview</h2>

            <div class="box-container">

                <div class="box">
                    <span class="icon">👥</span>
                    <p>Users</p>
                </div>

                <div class="box">
                    <span class="icon">📦</span>
                    <p>Products</p>
                </div>

                <div class="box">
                    <span class="icon">💰</span>
                    <p>Revenue</p>
                </div>

                <div class="box">
                    <span class="icon">📈</span>
                    <p>Growth</p>
                </div>

                <div class="box">
                    <span class="icon">📝</span>
                    <p>Orders</p>
                </div>

                <div class="box">
                    <span class="icon">⭐</span>
                    <p>Reviews</p>
                </div>

                <div class="box">
                    <span class="icon">📧</span>
                    <p>Messages</p>
                </div>

                <div class="box">
                    <span class="icon">🔔</span>
                    <p>Notifications</p>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
